[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsops"
dynamic = ["version"]
description = "SkillsOps — governance CLI for agent skills. Validate, audit, version, publish, and distribute skills across any IDE."
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
]
plugin = [
    "mcp>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-anyio>=0.0.0",
    "hypothesis>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
all = [
    "skillsops[server,plugin]",
]

[project.scripts]
skillctl = "skillctl.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "skillctl.version.__version__"}

[tool.setuptools.packages.find]
include = ["skillctl*"]

[tool.pytest.ini_options]
# Core governance test suite. The extracted optimizer
# (packages/skillsops-optimize) has its own suite and is not collected here.
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that spin up real servers / crypto",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
per-file-ignores = {"skillctl/**/cli.py" = ["E402"], "skillctl/eval/*.py" = ["E402"]}

[tool.coverage.run]
source = ["skillctl"]
omit = [
    "skillctl/github_auth.py",
    "skillctl/registry/github_backend.py",
    "skillctl/registry/server.py",
    "skillctl/registry/config.py",
    "skillctl/cli.py",
    "skillctl/eval/cli.py",
]
