name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check skillctl/ plugin/ tests/

      - name: Format check
        run: ruff format --check skillctl/ plugin/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev,plugin]" pyright

      - name: Type check
        run: pyright skillctl/ --pythonversion 3.10

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,plugin]" pytest-cov

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: pytest tests/ -m "not integration" -q

      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: pytest tests/ -m "not integration" -q --cov=skillctl --cov-report=term-missing:skip-covered

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install end-to-end dependencies
        run: pip install -e ".[dev,server,plugin,observability]"

      - name: Run real local end-to-end suite
        run: pytest tests/e2e -q

  test-optimize:
    # The optimizer was extracted to packages/skillsops-optimize in
    # Milestone 0. It has its own suite and depends on litellm (which
    # currently supports Python <3.14).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install core + optimizer package
        run: |
          pip install -e .
          pip install -e packages/skillsops-optimize
          pip install pytest pytest-anyio hypothesis

      - name: Run optimizer tests
        working-directory: packages/skillsops-optimize
        run: pytest -m "not integration" -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[all]" pip-audit

      - name: Audit dependencies
        run: pip-audit

  dogfood-audit:
    # Audit the example skills shipped in `examples/` using the
    # in-tree wheel.  Dogfoods the headline value prop — if the example
    # skills stop auditing clean, the README's pitch stops being true
    # and CI catches it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }

      - name: Install skillsops from this commit
        run: pip install -e .

      - name: Audit example skills
        run: |
          skillctl eval audit \
            examples/api-design-reviewer \
            examples/dependency-scanner \
            examples/tdd-workflow \
            --fail-on-warning

  build-smoke:
    # Build the sdist + wheel from a clean checkout, install only the
    # wheel (no editable install, no source checkout on the install side),
    # and verify the entry point resolves and reports the same version.
    # This catches pyproject/MANIFEST regressions that the editable
    # install hides — e.g. stale egg-info or rename-related artifacts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate package metadata and contents
        run: |
          pip install twine
          twine check dist/*
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("skillsops-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "skillctl/compliance/frameworks_data/eu_ai_act.yaml" in names
          assert "skillctl/cicd/templates/github-actions.yml" in names
          assert not any("__pycache__" in name or name.endswith(".pyc") for name in names)
          PY

      - name: Install built wheel in a fresh venv
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/skillsops-*.whl

      - name: Verify console script resolves and version matches source
        run: |
          set -euo pipefail
          source_version=$(python -c "from skillctl.version import __version__; print(__version__)")
          installed_version=$(/tmp/smoke-venv/bin/skillctl version | awk '{print $2}')
          echo "source=$source_version installed=$installed_version"
          /tmp/smoke-venv/bin/skillctl --help > /dev/null
          test "$source_version" = "$installed_version"

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build registry image
        run: docker build --tag skillsops-registry:ci .

      - name: Boot registry and verify health
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 8080:8080 skillsops-registry:ci)
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
